services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: airman-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: airman
      CLICKHOUSE_USER: airman_user
      CLICKHOUSE_PASSWORD: airman_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "airman_user", "--password", "airman_password", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  airman-pipeline:
    build: .
    container_name: airman-pipeline
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./models:/app/models
    command: python -m src.pipeline

volumes:
  clickhouse_data: